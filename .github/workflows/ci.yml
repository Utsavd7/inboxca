# Every pull request and every change to main: lint, types, unit tests, build, browser tests.
# Nothing merges with a red run (PLAN.md section 13.1).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # Migrations apply to a fresh database, one firm never reaches another's rows, and
  # signing in works end to end against local Supabase (its sign in and mail catcher).
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # A test mail server for the mailbox: office@firm.test, password "secret".
      - run: docker run -d -p 3025:3025 -p 3143:3143 -e GREENMAIL_OPTS="-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=office:secret@firm.test -Dgreenmail.users.login=email" greenmail/standalone:2.1.2
      - run: npx supabase start -x studio
      - run: npm run db:env
      - run: npm run test:db
      # The app's database types must match the migrations.
      - run: npx supabase gen types typescript --local --schema public > /tmp/types.ts
      - run: diff -q src/db/types.ts /tmp/types.ts || (echo "src/db/types.ts is out of date. Run npm run db:types." && exit 1)
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/sign-in.spec.ts tests/e2e/invites.spec.ts tests/e2e/clients.spec.ts tests/e2e/jobs.spec.ts tests/e2e/viewer.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sign-in-report
          path: test-results
          retention-days: 7
