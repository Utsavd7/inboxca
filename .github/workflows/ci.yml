# Every pull request once it is ready for review (drafts run nothing): lint, types and unit
# tests, then the database, one build and every browser test. A push to main is the tree its
# pull request already tested, so it does not run again; Run workflow starts one by hand.
# Nothing merges with a red run (PLAN.md section 13.1).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # A run started by hand has no pull request, and counts as not a draft.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Known high or critical flaws in the app's own packages fail the run (PLAN.md 8.9).
      - run: npm audit --omit=dev --audit-level=high
      # No key, token or env file in git (PLAN.md 8.9).
      - run: node scripts/secret-scan.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Migrations apply to a fresh database, one firm never reaches another's rows, and every
  # browser test runs end to end against local Supabase (its sign in and mail catcher).
  database:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # A test mail server for the mailbox: office@firm.test, password "secret".
      - run: docker run -d -p 3025:3025 -p 3143:3143 -e GREENMAIL_OPTS="-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=office:secret@firm.test -Dgreenmail.users.login=email" greenmail/standalone:2.1.2
      - run: npx supabase start -x studio
      - run: npm run db:env
      - run: npm run test:db
      # The app's database types must match the migrations.
      - run: npx supabase gen types typescript --local --schema public > /tmp/types.ts
      - run: diff -q src/db/types.ts /tmp/types.ts || (echo "src/db/types.ts is out of date. Run npm run db:types." && exit 1)
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
